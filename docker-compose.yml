version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-}
    volumes:
      # Persiste las imagenes subidas (MediaAsset). Sin esto se pierden en
      # cada `up --build` / recreacion del contenedor.
      - uploads:/usr/src/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      # OJO (deuda pendiente, severidad media): esto expone Postgres al host.
      # Sirve para correr `npm run start:dev` fuera de Docker en local.
      # Para produccion hay que quitarlo: solo `api` necesita a `db` y lo
      # alcanza por la red interna de compose (host `db`).
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
